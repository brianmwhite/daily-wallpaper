[project]
name = "bing-wallpaper-daily-mac-multimonitor"
version = "1.4.0"
description = "Download the Bing daily wallpaper and set it across macOS desktops and monitors."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Lukas Pikora" }]
keywords = ["bing", "wallpaper", "macos", "desktop", "automation"]
dependencies = []

[project.scripts]
bing-wallpaper-daily-mac-multimonitor = "bing_wallpaper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bing_wallpaper"]

[tool.uv]
package = true
